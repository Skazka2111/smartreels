[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-reels-studio"
version = "0.1.0"
description = "Desktop tool that turns long speaking videos into vertical short clips"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "PySide6>=6.8,<6.10",
  "httpx>=0.27,<1",
  "opencv-python-headless>=4.10,<5",
  "numpy>=2.0,<3",
  "platformdirs>=4.3,<5",
  "Pillow>=10.4,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
build = ["pyinstaller>=6.11,<7"]

[project.scripts]
smart-reels = "smart_reels.cli:main"
smart-reels-gui = "smart_reels.gui.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
smart_reels = ["assets/*.png", "assets/*.onnx"]

[tool.pytest.ini_options]
pythonpath = ["src"]
